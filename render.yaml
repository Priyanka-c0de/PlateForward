services:
  - type: web
    name: urban-food-waste-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements_backend.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      DATABASE_URL: sqlite:///./food_waste.db
    autoDeploy: true
    region: oregon

  - type: web
    name: urban-food-waste-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    region: oregon
    envVars:
      VITE_API_BASE_URL: https://urban-food-waste-backend.onrender.com
    redirect: true
